name: 🚀 Warp Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: ✅ Quality Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run lint || true
      - run: npx tsc --noEmit || true
      # Candado de caja (2026-11-07): estas pruebas SÍ bloquean el PR si fallan.
      # Cuidan que una caja cerrada no se reabra y que cada equipo use su caja.
      - name: 🔒 Pruebas de caja (obligatorias)
        run: npx vitest run src/lib/caja-cierre-gana.test.ts src/hooks/useVentas.test.tsx src/lib/sync-merge-local-gana.test.ts

  build:
    name: 🏗️ Build
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/

  deploy-preview:
    name: 🔍 Preview (PR only)
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-output
          path: dist/
      # Deploy preview a Netlify o Vercel (configurar tokens como secrets)
      # - uses: nwtgck/actions-netlify@v2
      #   with:
      #     publish-dir: './dist'
      #     production-branch: main
      #   env:
      #     NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      #     NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
